[package]
name = "fl27mm-ui"
version = "1.4.0"
edition = "2021"
description = "Desktop UI for the FL27 mod manager"

[lib]
name = "fl27mm_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fl27mm = { path = "../.." }
png = "0.17"
base64 = "0.22"
