[package]
name = "fl27mm-python"
version = "1.4.0"
edition = "2021"
description = "PyO3 bindings for the FL27 Mod Manager"
license-file = "../LICENSE"

[lib]
name = "_fl27mm"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
fl27mm = { path = ".." }
png = "0.18"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
serde = "1"
serde_json = "1"
