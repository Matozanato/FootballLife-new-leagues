[package]
name = "fl27mm"
version = "1.4.0"
edition = "2021"
description = "Optional native tools for FL Mod Studio: CPK archives, textures, models and animations"
license-file = "LICENSE"

[lib]
name = "fl27mm"
path = "src/lib.rs"

[[bin]]
name = "fl27mm"
path = "src/main.rs"

[workspace]
members = ["python"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.11"
nom = "8.0.0"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zlib-rs = "0.6.8"

# No panic = "abort" here on purpose. A panicked task is reported to the host
# as an error it can show and retry; aborting would take the whole process
# down. Every buffer size that comes from a file is bounds-checked instead.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
